<style>
:root{
  --bg:#ffffff; --soft:#f7f8fa; --card:#ffffff;
  --line:#eceff4; --line2:#e2e7ef;
  --tx:#111827; --tx2:#6b7280; --tx3:#9ca3af;
  --pri:#2563eb; --pri2:#4f7dfb;
  --ok:#059669;
  --r:18px; --ease:cubic-bezier(.22,.61,.36,1);
}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html,body{margin:0;padding:0}
body{
  background:var(--soft);color:var(--tx);line-height:1.6;
  font-family:system-ui,-apple-system,"HarmonyOS Sans SC","PingFang SC","Noto Sans CJK SC",sans-serif;
  -webkit-font-smoothing:antialiased;
  padding:0 16px 48px;
  min-height:100vh;
}
.wrap{max-width:520px;margin:0 auto}

/* 顶部 */
.hero{
  text-align:center;padding:52px 0 34px;
}
.logo{
  width:66px;height:66px;border-radius:20px;margin:0 auto 18px;
  display:grid;place-items:center;font-size:31px;font-weight:900;color:#fff;
  background:linear-gradient(150deg,#2563eb,#60a5fa);
  box-shadow:0 16px 34px -16px rgba(37,99,235,.75);
}
.hero h1{
  margin:0;font-size:26px;font-weight:800;letter-spacing:-.7px;
  background:linear-gradient(120deg,#111827,#374151);
  -webkit-background-clip:text;background-clip:text;color:transparent;
}
.hero p{margin:8px 0 0;color:var(--tx2);font-size:13.5px;letter-spacing:.2px}

/* 卡片 */
.list{display:flex;flex-direction:column;gap:12px}

.app{
  position:relative;display:flex;align-items:center;gap:14px;
  padding:16px;border-radius:var(--r);
  background:var(--card);border:1px solid var(--line);
  box-shadow:0 1px 2px rgba(16,24,40,.04), 0 8px 24px -20px rgba(16,24,40,.35);
  transition:.22s var(--ease);
}
.app:active{transform:scale(.985);box-shadow:0 1px 2px rgba(16,24,40,.06)}

.ico{
  width:52px;height:52px;flex:0 0 52px;border-radius:15px;
  display:grid;place-items:center;font-size:24px;font-weight:800;color:#fff;
  box-shadow:0 8px 18px -10px rgba(16,24,40,.5);
}
.ico.a{background:linear-gradient(150deg,#2563eb,#60a5fa)}
.ico.b{background:linear-gradient(150deg,#7c3aed,#c084fc)}

.info{flex:1;min-width:0;padding-right:4px}
.name{display:flex;align-items:center;gap:7px;margin-bottom:3px}
.name b{font-size:16px;font-weight:750;letter-spacing:-.2px}
.ver{
  font-size:10.5px;font-weight:700;color:var(--pri);
  background:rgba(37,99,235,.08);border:1px solid rgba(37,99,235,.18);
  padding:1px 6px;border-radius:5px;letter-spacing:.3px;
}
.desc{font-size:12.5px;color:var(--tx2);margin-bottom:5px}
.meta{display:flex;align-items:center;gap:8px;font-size:11.5px;color:var(--tx3)}
.meta i{font-style:normal}
.meta .dot{width:2.5px;height:2.5px;border-radius:50%;background:var(--tx3)}

.dl{
  flex:0 0 auto;display:inline-flex;align-items:center;gap:6px;
  padding:11px 17px;border-radius:12px;text-decoration:none;
  font-size:13.5px;font-weight:700;color:#fff;white-space:nowrap;
  background:linear-gradient(100deg,var(--pri),var(--pri2));
  box-shadow:0 10px 22px -12px rgba(37,99,235,.9);
  transition:.18s var(--ease);
}
.dl:active{transform:scale(.95)}
.dl svg{width:15px;height:15px;fill:none;stroke:currentColor;stroke-width:2.2;stroke-linecap:round;stroke-linejoin:round}

/* 说明 */
.note{
  margin-top:22px;padding:16px 17px;border-radius:15px;
  background:#fff;border:1px solid var(--line);
  font-size:12.5px;color:var(--tx2);line-height:1.85;
}
.note b{color:var(--tx);font-weight:650}
.note .row{display:flex;gap:9px;margin-bottom:10px}
.note .row:last-child{margin-bottom:0}
.note .n{
  flex:0 0 18px;height:18px;border-radius:50%;margin-top:2px;
  background:rgba(37,99,235,.08);color:var(--pri);
  font-size:11px;font-weight:800;display:grid;place-items:center;
}

footer{
  text-align:center;font-size:11.5px;color:var(--tx3);
  margin-top:30px;line-height:1.9;
}
footer .line{width:32px;height:2px;border-radius:2px;background:var(--line2);margin:0 auto 16px}
</style>
</head>
