/* ============================================================
   渲染逻辑（一般不用改）
   ============================================================ */
(function(){
  "use strict";
  var grid = document.getElementById("grid"),
      chips = document.getElementById("chips"),
      q = document.getElementById("q"),
      state = {cat:"全部", kw:""};

  document.getElementById("yr").textContent = new Date().getFullYear();
  document.getElementById("n1").textContent = TOOLS.length;
  document.getElementById("n2").textContent = CATS.length - 1;

  /* 分类按钮（带数量） */
  CATS.forEach(function(c){
    var n = c === "全部" ? TOOLS.length : TOOLS.filter(function(t){return t.c === c;}).length;
    if(c !== "全部" && !n) return;
    var b = document.createElement("button");
    b.className = "chip" + (c === state.cat ? " on" : "");
    b.type = "button";
    b.textContent = c + " " + n;
    b.addEventListener("click", function(){
      state.cat = c;
      Array.prototype.forEach.call(chips.children, function(el){ el.classList.remove("on"); });
      b.classList.add("on");
      render();
    });
    chips.appendChild(b);
  });

  /* 搜索：匹配名称 / 描述 / 平台 / 分类 */
  q.addEventListener("input", function(){
    state.kw = q.value.trim().toLowerCase();
    render();
  });

  function initial(t){
    var m = t.t.match(/[A-Za-z]/);
    return (m ? m[0] : t.t.charAt(0)).toUpperCase();
  }

  function esc(s){
    return String(s).replace(/[&<>"]/g, function(c){
      return {"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;"}[c];
    });
  }

  function render(){
    var list = TOOLS.filter(function(t){
      if(state.cat !== "全部" && t.c !== state.cat) return false;
      if(!state.kw) return true;
      var hay = (t.t + t.c + t.d + (t.k||"") + t.p.join("")).toLowerCase();
      return hay.indexOf(state.kw) > -1;
    });

    if(!list.length){
      grid.innerHTML = '<div class="empty"><div>🫥</div>没找到相关工具，换个词试试？<br><small>比如「压缩」「远程」「安卓」</small></div>';
      return;
    }

    grid.innerHTML = list.map(function(t, i){
      var isWeb = t.p.indexOf("网页") > -1;
      var badge = t.k
        ? '<span class="badge' + (t.k === "国产" ? " cn" : "") + '">' + esc(t.k) + '</span>'
        : "";
      var plats = t.p.map(function(p){ return "<i>" + esc(p) + "</i>"; }).join("");
      return '<a class="card" href="' + esc(t.u) + '" target="_blank" rel="noopener noreferrer"'
           + ' style="animation-delay:' + Math.min(i * 22, 300) + 'ms">'
           +   '<div class="ico">' + esc(initial(t)) + '</div>'
           +   '<div class="body">'
           +     '<h3>' + esc(t.t) + badge + '</h3>'
           +     '<p>' + esc(t.d) + '</p>'
           +     '<div class="meta">' + plats
           +       '<span class="dl">' + (isWeb ? "打开 →" : "官网下载 →") + '</span>'
           +     '</div>'
           +   '</div>'
           + '</a>';
    }).join("");
  }

  /* 复制全部链接 */
  document.getElementById("copy").addEventListener("click", function(){
    var txt = TOOLS.map(function(t){ return t.t + "\t" + t.u; }).join("\n");
    var btn = this, old = btn.textContent;
    function done(){ btn.textContent = "✓ 已复制 " + TOOLS.length + " 条"; setTimeout(function(){ btn.textContent = old; }, 1800); }
    if(navigator.clipboard && navigator.clipboard.writeText){
      navigator.clipboard.writeText(txt).then(done, function(){ fallback(); });
    } else { fallback(); }
    function fallback(){
      var ta = document.createElement("textarea");
      ta.value = txt; ta.style.position = "fixed"; ta.style.opacity = "0";
      document.body.appendChild(ta); ta.select();
      try{ document.execCommand("copy"); done(); }catch(e){ alert("复制失败，请手动下载清单文件"); }
      document.body.removeChild(ta);
    }
  });

  /* 深浅色 */
  var root = document.documentElement,
      tb = document.getElementById("theme"),
      KEY = "toolbox-theme";
  function apply(mode){
    root.setAttribute("data-theme", mode);
    tb.textContent = mode === "light" ? "☀️" : "🌙";
    try{ localStorage.setItem(KEY, mode); }catch(e){}
  }
  var saved = null;
  try{ saved = localStorage.getItem(KEY); }catch(e){}
  if(!saved && window.matchMedia){
    saved = window.matchMedia("(prefers-color-scheme: light)").matches ? "light" : "dark";
  }
  apply(saved || "dark");
  tb.addEventListener("click", function(){
    apply(root.getAttribute("data-theme") === "light" ? "dark" : "light");
  });

  /* 顶栏分隔线 */
  var hd = document.getElementById("hd");
  window.addEventListener("scroll", function(){
    hd.classList.toggle("stuck", window.scrollY > 6);
  }, {passive:true});

  render();
})();
</script>
</body>
</html>
