<style>
:root{
  --bg:#f5f6f8; --card:#fff; --line:rgba(15,23,42,.08);
  --tx:#0f172a; --tx2:#64748b; --tx3:#94a3b8;
  --pri:#2563eb; --pri2:#3b82f6; --ok:#16a34a;
  --r:16px; --ease:cubic-bezier(.22,.61,.36,1);
}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html,body{margin:0;padding:0}
body{
  background:var(--bg);color:var(--tx);line-height:1.6;
  font-family:system-ui,-apple-system,"HarmonyOS Sans SC","PingFang SC","Noto Sans CJK SC",sans-serif;
  -webkit-font-smoothing:antialiased;
  padding:0 14px 40px;
}
.wrap{max-width:560px;margin:0 auto}

header{text-align:center;padding:44px 0 26px}
.mark{
  width:62px;height:62px;border-radius:19px;margin:0 auto 16px;
  display:grid;place-items:center;font-size:29px;font-weight:900;color:#fff;
  background:linear-gradient(145deg,var(--pri),var(--pri2));
  box-shadow:0 14px 30px -14px rgba(37,99,235,.6);
}
header h1{margin:0;font-size:24px;font-weight:800;letter-spacing:-.5px}
header p{margin:7px 0 0;color:var(--tx2);font-size:13.5px}

.sect{font-size:12.5px;font-weight:700;color:var(--tx3);letter-spacing:1.2px;margin:22px 0 10px 4px;text-transform:uppercase}

.app{
  display:flex;align-items:center;gap:13px;padding:15px;border-radius:var(--r);
  background:var(--card);border:1px solid var(--line);margin-bottom:10px;
  box-shadow:0 6px 20px -16px rgba(15,23,42,.3);
}
.ico{
  width:50px;height:50px;flex:0 0 50px;border-radius:14px;display:grid;place-items:center;
  font-size:23px;font-weight:800;color:#fff;
}
.ico.a{background:linear-gradient(145deg,#2563eb,#3b82f6)}
.ico.b{background:linear-gradient(145deg,#7c3aed,#a78bfa)}
.ico.c{background:linear-gradient(145deg,#0d9488,#2dd4bf)}
.info{flex:1;min-width:0}
.info b{display:block;font-size:15.5px;font-weight:750;margin-bottom:2px}
.info span{font-size:12.5px;color:var(--tx2)}
.info em{
  font-style:normal;font-size:11px;color:var(--ok);font-weight:700;
  background:rgba(22,163,74,.09);border:1px solid rgba(22,163,74,.25);
  padding:1px 6px;border-radius:5px;margin-left:6px;
}
.dl{
  flex:0 0 auto;padding:10px 18px;border-radius:11px;
  background:linear-gradient(100deg,var(--pri),var(--pri2));color:#fff;
  font-size:13.5px;font-weight:700;text-decoration:none;white-space:nowrap;
  box-shadow:0 8px 20px -10px rgba(37,99,235,.8);transition:.18s var(--ease);
}
.dl:active{transform:scale(.96)}
.dl.ghost{background:#fff;color:var(--pri);border:1px solid var(--line);box-shadow:none}

.linkrow{
  display:flex;align-items:center;justify-content:space-between;
  padding:15px 16px;border-radius:13px;background:var(--card);
  border:1px solid var(--line);margin-bottom:10px;
  text-decoration:none;color:var(--tx);font-size:14.5px;font-weight:600;
}
.linkrow span{color:var(--tx3);font-weight:400;font-size:13px}
.linkrow:active{background:#f8fafc}

.tip{
  margin-top:20px;padding:15px;border-radius:13px;
  background:rgba(37,99,235,.05);border:1px solid rgba(37,99,235,.15);
  font-size:12.5px;color:var(--tx2);line-height:1.8;
}
.tip b{color:var(--tx)}

footer{text-align:center;font-size:12px;color:var(--tx3);margin-top:26px;line-height:1.9}
</style>
