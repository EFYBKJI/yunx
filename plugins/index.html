<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="theme-color" content="#f5f6f8">
<title>插件市场</title>
<style>
:root{
  --bg:#f5f6f8; --card:#fff; --line:#eceff4;
  --tx:#111827; --tx2:#6b7280; --tx3:#9ca3af;
  --pri:#2563eb; --pri2:#4f7dfb; --ok:#059669;
  --r:16px; --ease:cubic-bezier(.22,.61,.36,1);
}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
body{
  margin:0;background:var(--bg);color:var(--tx);line-height:1.6;
  font-family:system-ui,-apple-system,"HarmonyOS Sans SC","PingFang SC",sans-serif;
  -webkit-font-smoothing:antialiased;padding:0 14px 44px;
}
.wrap{max-width:560px;margin:0 auto}

header{text-align:center;padding:38px 0 18px}
.logo{
  width:58px;height:58px;border-radius:17px;margin:0 auto 14px;
  display:grid;place-items:center;font-size:27px;
  background:linear-gradient(150deg,#7c3aed,#a78bfa);color:#fff;
  box-shadow:0 14px 30px -14px rgba(124,58,237,.7);
}
header h1{margin:0;font-size:22px;font-weight:800;letter-spacing:-.5px}
header p{margin:6px 0 0;color:var(--tx2);font-size:13px}

/* 搜索 */
.search{
  display:flex;align-items:center;gap:9px;background:#fff;
  border:1px solid var(--line);border-radius:13px;padding:12px 14px;margin-bottom:12px;
  box-shadow:0 1px 2px rgba(16,24,40,.04);
}
.search input{
  flex:1;border:0;outline:none;background:none;font-size:15px;color:var(--tx);
  font-family:inherit;min-width:0;
}
.search svg{width:17px;height:17px;stroke:var(--tx3);fill:none;stroke-width:2;flex:0 0 17px}

/* 分类 */
.cats{display:flex;gap:7px;overflow-x:auto;padding-bottom:12px;scrollbar-width:none}
.cats::-webkit-scrollbar{display:none}
.cat{
  flex:0 0 auto;padding:7px 14px;border-radius:999px;font-size:12.5px;font-weight:600;
  background:#fff;border:1px solid var(--line);color:var(--tx2);cursor:pointer;
  font-family:inherit;transition:.16s var(--ease);
}
.cat.on{background:var(--pri);border-color:var(--pri);color:#fff}

/* 下载源切换 */
.source{
  display:flex;align-items:center;gap:10px;background:#fff;border:1px solid var(--line);
  border-radius:13px;padding:11px 14px;margin-bottom:14px;
}
.source .lab{font-size:12.5px;color:var(--tx2);flex:1}
.seg{display:flex;background:#f1f5f9;border-radius:9px;padding:3px;gap:2px}
.seg button{
  padding:6px 13px;border:0;border-radius:7px;background:none;cursor:pointer;
  font-size:12.5px;font-weight:600;color:var(--tx2);font-family:inherit;transition:.16s;
}
.seg button.on{background:#fff;color:var(--pri);box-shadow:0 2px 5px -2px rgba(16,24,40,.18)}

/* 列表 */
.plugin{
  display:flex;align-items:center;gap:13px;padding:15px;border-radius:var(--r);
  background:#fff;border:1px solid var(--line);margin-bottom:10px;
  box-shadow:0 1px 2px rgba(16,24,40,.04),0 8px 24px -22px rgba(16,24,40,.4);
  transition:.18s var(--ease);
}
.plugin:active{transform:scale(.99)}
.pico{
  width:46px;height:46px;flex:0 0 46px;border-radius:13px;display:grid;place-items:center;
  font-size:21px;background:#f1f5f9;
}
.pinfo{flex:1;min-width:0}
.pname{display:flex;align-items:center;gap:6px;margin-bottom:2px}
.pname b{font-size:15px;font-weight:750}
.pver{font-size:10px;font-weight:700;color:var(--pri);background:rgba(37,99,235,.08);border:1px solid rgba(37,99,235,.18);padding:1px 5px;border-radius:4px}
.pdesc{font-size:12px;color:var(--tx2);margin-bottom:4px;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.pmeta{font-size:11px;color:var(--tx3);display:flex;gap:8px;align-items:center}
.pmeta .d{width:2.5px;height:2.5px;border-radius:50%;background:var(--tx3)}
.get{
  flex:0 0 auto;padding:9px 15px;border-radius:11px;text-decoration:none;
  font-size:13px;font-weight:700;color:#fff;
  background:linear-gradient(100deg,var(--pri),var(--pri2));
  box-shadow:0 8px 18px -10px rgba(37,99,235,.8);
}
.get:active{transform:scale(.95)}
.get.mirror{background:#111827;box-shadow:0 8px 18px -10px rgba(17,24,39,.7)}

.empty{text-align:center;padding:50px 16px;color:var(--tx3);font-size:13.5px}

.tip{
  margin-top:18px;padding:15px;border-radius:14px;background:#fff;border:1px solid var(--line);
  font-size:12px;color:var(--tx2);line-height:1.9;
}
.tip b{color:var(--tx)}
footer{text-align:center;font-size:11.5px;color:var(--tx3);margin-top:24px}
</style>
</head>
<body>
<div class="wrap">

  <header>
    <div class="logo">🧩</div>
    <h1>插件市场</h1>
    <p>下载即用 · 支持镜像加速</p>
  </header>

  <div class="search">
    <svg viewBox="0 0 24 24"><circle cx="11" cy="11" r="7"/><path d="M20 20l-3.5-3.5"/></svg>
    <input id="q" type="search" placeholder="搜索插件名称或功能" autocomplete="off">
  </div>

  <div class="cats" id="cats"></div>

  <div class="source">
    <span class="lab">下载源</span>
    <div class="seg">
      <button class="on" data-src="local">本站</button>
      <button data-src="mirror">镜像</button>
    </div>
  </div>

  <div id="list"></div>
  <div class="empty" id="empty" style="display:none">没有匹配的插件</div>

  <div class="tip">
    <b>本站：</b>直接从这里下载（文件放在网站的 <code>plugins/</code> 目录）。<br>
    <b>镜像：</b>从别人提供的链接下载，但**仍然经过本站**（走 <code>/dl</code> 代理），速度取决于对方线路。
  </div>

  <footer>© <span id="yr"></span> 插件市场 · 持续更新</footer>
</div>

<script>
(function(){
  "use strict";
  var API_DL = "https://yunxapp.dpdns.org/dl";

  /* ====== 插件数据：以后加插件改这里 ====== */
  var PLUGINS = [
    { n:"网页搜索增强", c:"检索", e:"🔍", v:"1.2.0", s:"12 KB", fmt:"zip",
      d:"给 Harness 加上联网搜索能力，支持多个搜索引擎",
      local:"plugins/websearch-1.2.0.zip", mirror:"" },

    { n:"代码沙箱执行", c:"开发", e:"⌨️", v:"2.0.1", s:"86 KB", fmt:"zip",
      d:"在隔离环境里跑 Python / Node 片段，结果直接回填",
      local:"plugins/sandbox-2.0.1.zip", mirror:"" },

    { n:"语音输入", c:"输入", e:"🎙", v:"1.0.4", s:"5.2 MB", fmt:"zip",
      d:"说话转文字，长句自动断句与标点",
      local:"plugins/voice-1.0.4.zip", mirror:"" },

    { n:"图片理解", c:"视觉", e:"🖼", v:"1.1.0", s:"2.4 MB", fmt:"zip",
      d:"把截图 / 照片交给模型识别，支持多图",
      local:"plugins/vision-1.1.0.zip", mirror:"" },

    { n:"文件管理器", c:"系统", e:"📁", v:"0.9.2", s:"18 KB", fmt:"zip",
      d:"浏览、复制、移动本地文件，支持批量重命名",
      local:"plugins/files-0.9.2.zip", mirror:"" },

    { n:"定时任务", c:"自动化", e:"⏰", v:"1.3.0", s:"24 KB", fmt:"zip",
      d:"按 cron 表达式定时触发任务，失败自动重试",
      local:"plugins/cron-1.3.0.zip", mirror:"" },

    { n:"MCP 连接器", c:"集成", e:"🔌", v:"1.0.0", s:"41 KB", fmt:"zip",
      d:"一键接入各类 MCP 服务，自动读取能力清单",
      local:"plugins/mcp-1.0.0.zip", mirror:"" },

    { n:"主题包 · 极简白", c:"外观", e:"🎨", v:"1.0.2", s:"8 KB", fmt:"zip",
      d:"浅色极简界面主题，护眼低对比",
      local:"plugins/theme-light-1.0.2.zip", mirror:"" }
  ];

  var src = "local", cat = "全部", kw = "";
  var $ = function(id){ return document.getElementById(id); };
  $("yr").textContent = new Date().getFullYear();

  var CATS = ["全部"].concat(Array.from(new Set(PLUGINS.map(function(p){ return p.c; }))));
  $("cats").innerHTML = CATS.map(function(c, i){
    return '<button class="cat' + (i === 0 ? " on" : "") + '" data-c="' + c + '">' + c + '</button>';
  }).join("");

  $("cats").addEventListener("click", function(ev){
    var b = ev.target.closest("[data-c]"); if(!b) return;
    cat = b.getAttribute("data-c");
    Array.prototype.forEach.call(this.children, function(el){ el.classList.toggle("on", el === b); });
    render();
  });

  document.querySelector(".seg").addEventListener("click", function(ev){
    var b = ev.target.closest("[data-src]"); if(!b) return;
    src = b.getAttribute("data-src");
    Array.prototype.forEach.call(this.children, function(el){ el.classList.toggle("on", el === b); });
    render();
  });

  $("q").addEventListener("input", function(){ kw = this.value.trim().toLowerCase(); render(); });

  function esc(s){
    return String(s == null ? "" : s).replace(/[&<>"]/g, function(c){
      return {"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;"}[c];
    });
  }

  function hrefOf(p){
    if(src === "local"){
      return "https://efybkji.github.io/yunx/" + p.local;
    }
    if(!p.mirror) return "";
    return API_DL + "?u=" + encodeURIComponent(p.mirror) + "&n=" + encodeURIComponent(p.n + "-" + p.v + "." + p.fmt);
  }

  function render(){
    var list = PLUGINS.filter(function(p){
      if(cat !== "全部" && p.c !== cat) return false;
      if(!kw) return true;
      return (p.n + p.d + p.c).toLowerCase().indexOf(kw) > -1;
    });

    $("empty").style.display = list.length ? "none" : "block";

    $("list").innerHTML = list.map(function(p){
      var h = hrefOf(p);
      var btn = h
        ? '<a class="get' + (src === "mirror" ? " mirror" : "") + '" href="' + h + '" download>下载</a>'
        : '<span class="get" style="background:#e5e7eb;color:#9ca3af;box-shadow:none">暂无镜像</span>';
      return '<div class="plugin">'
        + '<div class="pico">' + p.e + '</div>'
        + '<div class="pinfo">'
        +   '<div class="pname"><b>' + esc(p.n) + '</b><span class="pver">v' + esc(p.v) + '</span></div>'
        +   '<div class="pdesc">' + esc(p.d) + '</div>'
        +   '<div class="pmeta"><span>' + esc(p.c) + '</span><span class="d"></span><span>' + esc(p.s) + '</span><span class="d"></span><span>.' + esc(p.fmt) + '</span></div>'
        + '</div>'
        + btn
        + '</div>';
    }).join("");
  }

  render();
})();
</script>
</body>
</html>
